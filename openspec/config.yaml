  Linux возвращает переносимые файлы без ложного подтверждения копирования.
  Проект qag реализован на Go/React/TypeScript: каталог и архив, редактор,
  ресурсы, HTTP/gRPC/PostgreSQL-вызовы, сравнение и история прогонов.
  Бинарник включает UI; приложение и единственный PostgreSQL запускаются через Docker Compose.
  Изменение refine-run-actions-and-variants завершено: 19/19 задач, архив
  openspec/changes/archive/2026-10-29-refine-run-actions-and-variants;
