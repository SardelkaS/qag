schema: spec-driven

context: |
  Проект qag реализован на Go/React/TypeScript: каталог и архив, редактор,
  ресурсы, HTTP/gRPC/PostgreSQL-вызовы, сравнение и история прогонов.
  Бинарник включает UI; PostgreSQL запускается через Docker Compose.
  Изменение refine-run-layout-and-appearance завершено: 16/16 задач, хранится в
  openspec/changes/archive/2026-10-27-refine-run-layout-and-appearance;
  пять delta-разделов синхронизированы. Тёмные поверхности нейтральные; favicon версионируется
  по содержимому. Есть явные пояснения readonly и правая sticky-колонка статуса.
  Изменение enhance-run-workflow-and-reporting завершено: 50/50 задач, хранится в
  openspec/changes/archive/2026-10-27-enhance-run-workflow-and-reporting;
  все восемь delta-разделов синхронизированы. Рабочая схема использует восемь миграций.
  Compose содержит один PostgreSQL и БД qag; проверки работают в уникальных
  app/demo/target-схемах с ограниченными ролями, manifest и общей локальной PKI.
  Есть серверная последовательная очередь «Выполнить всё», отмена прогона,
  три ручных статуса справа от шага и исследовательские вкладки запросов.
  Варианты сохраняют версии/попытки и не влияют на официальный итог.
  Согласованный отчёт экспортируется в PDF, текст, Markdown и rich clipboard
  с встроенными PNG; ожидаемые результаты исключаются переключателем.
  Windows clipboard предоставляет RTF/HTML/Unicode, проверена реальная вставка
  в Word и Chromium. Иконка сгенерирована и входит в Web UI и Windows PE.
  Редактор сохраняет черновики без обязательных полей, поддерживает изображения
  ожидаемого результата шагов и вызовов и селектор совместимых ресурсов.
  Есть светлая, тёмная и системная темы. Окружение создаётся с именем и описанием;
  открытые и секретные переменные настраиваются рядом с ресурсами.
  Для подключений доступны plaintext/TLS/mTLS. Заголовки HTTP и метаданные gRPC
  могут получать скаляр из JSON отдельного HTTP-источника перед каждым вызовом
  либо один раз на прогон; полученные значения маскируются и не сохраняются.
  Изменение enhance-test-authoring-and-resources завершено (35/35 задач) и хранится
  в openspec/changes/archive/2026-10-26-enhance-test-authoring-and-resources;
  все восемь delta-разделов синхронизированы; на тот момент было шесть миграций.
  Встроенный демонстрационный сервис предоставляет HTTP и unary gRPC с reflection,
  читает qag_demo.items в той же БД через отдельную ограниченную роль.
  Готовый кейс из пяти шагов закреплён над папками; сценарий и системные ресурсы
  доступны только для чтения, ручные прогоны и история доступны пользователю.
  Изменение add-local-demo-service архивировано в
  openspec/changes/archive/2026-10-26-add-local-demo-service; выполнены 25 задач,
  пять разделов спецификаций синхронизированы с openspec/specs.
  Завершённое изменение add-manual-testing-app хранится в
  openspec/changes/archive/2026-10-25-add-manual-testing-app; выполнены все 52 задачи.
  Подтверждённые проверки отражены в docs/verification.md.
  Приложение на Go и TypeScript предоставляет Web UI для создания и ручного
  прохождения тест-кейсов с частичной автоматизацией через HTTP, gRPC и SQL.
  Первая версия работает локально для одного пользователя без авторизации.
  PostgreSQL хранит тест-кейсы, настройки и сохраняемые прогоны; SQL-блоки
  первой версии также поддерживают только PostgreSQL.
  Слева находится раскрываемый список папок и тест-кейсов; папки переносятся
  на вкладку архива, архивные тест-кейсы тусклые и сортируются после активных.
  Папки и тест-кейсы сортируются по алфавиту. В центре открывается редактор
  тест-кейса с шагами: необязательный заголовок, описание и блоки вызовов.
  У каждого блока есть параметры запроса, ожидаемый результат, запуск и
  удобное сравнение ожидаемого результата с фактическим.
  Ресурсы настраиваются отдельно: именованный ресурс задаёт адрес, сертификаты
  и параметры подключения, которые подставляются при запуске запроса.
  Первый прогон и первый успешный прогон тест-кейса сохраняются автоматически;
  любой другой прогон пользователь может сохранить отдельной кнопкой.
  Пиши документы и пояснения на русском языке, сохраняя структурные заголовки
  OpenSpec и ключевые слова SHALL/MUST, WHEN/THEN на английском.

