name: qag

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: qag
      POSTGRES_USER: qag
      POSTGRES_PASSWORD: ${QAG_POSTGRES_PASSWORD:?Run scripts/init-local.ps1 first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qag -d qag"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres-test:
    image: postgres:18.6-alpine3.24
    profiles: [test]
    environment:
      POSTGRES_DB: qag_test
      POSTGRES_USER: qag_test
      POSTGRES_PASSWORD: ${QAG_TEST_POSTGRES_PASSWORD:?Run scripts/init-local.ps1 first}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qag_test -d qag_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  postgres-test-data:
