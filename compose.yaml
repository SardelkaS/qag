name: qag

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: qag
      POSTGRES_USER: qag
      POSTGRES_PASSWORD: ${QAG_POSTGRES_PASSWORD:?Run scripts/init-local.ps1 first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./.local/pki/ca.crt:/tmp/qag-pki/ca.crt:ro
      - ./.local/pki/server.crt:/tmp/qag-pki/server.crt:ro
      - ./.local/pki/server.key:/tmp/qag-pki/server.key:ro
      - ./.local/pki/pg_hba.conf:/tmp/qag-pki/pg_hba.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /run/qag-pki &&
        cp /tmp/qag-pki/ca.crt /tmp/qag-pki/server.crt /tmp/qag-pki/server.key /tmp/qag-pki/pg_hba.conf /run/qag-pki/ &&
        chown -R postgres:postgres /run/qag-pki &&
        chmod 600 /run/qag-pki/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/run/qag-pki/server.crt
        -c ssl_key_file=/run/qag-pki/server.key
        -c ssl_ca_file=/run/qag-pki/ca.crt
        -c hba_file=/run/qag-pki/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qag -d qag"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
